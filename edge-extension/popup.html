<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <h2>秋招工作台助手</h2>
    <div class="muted" style="margin:-6px 0 12px">独立小窗：切网页不消失，点窗口右上角 × 关闭</div>

    <button id="capture" class="big">📸 捕捉当前页岗位</button>
    <div id="cap-form" class="box" style="display:none">
      <label>招聘公司 *（招人的公司，不是网站名）</label><input id="c-company" placeholder="如 腾讯 / 字节跳动">
      <label>岗位 *</label><input id="c-title" placeholder="如 UI设计师 / 产品经理">
      <label>地点</label><input id="c-loc" placeholder="如 深圳">
      <label>来源网站 / 官网（自动识别公司招聘官网，可改）</label><input id="c-source" placeholder="如 https://jobs.netease.com">
      <div class="muted" id="c-platform" style="margin:2px 0 6px"></div>
      <div class="muted" id="c-url-show" style="word-break:break-all;margin:2px 0 8px"></div>
      <label>JD（可选）</label><textarea id="c-jd" rows="5" placeholder="自动抓取，可修改"></textarea>
      <button id="cap-save" class="primary">加入岗位池</button>
    </div>

    <hr>

    <button id="fill" class="big">📝 填网申</button>
    <div id="fill-box" class="box" style="display:none">
      <label>选择企业（确认上下文）</label>
      <select id="f-company"></select>
      <button id="fill-go" class="primary">填充当前页表单</button>
      <button id="rec-resume" class="big" style="margin-top:8px">📄 推荐简历（当前公司）</button>
      <div id="fill-status" class="muted"></div>
      <div id="rec-result" class="box" style="display:none;margin-top:8px"></div>
    </div>

    <div id="status" class="muted"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
